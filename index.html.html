<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>Neon Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#080b16;--panel:#101526;--line:#222a40;--muted:#78829c;--cyan:#4af4ff;--pink:#ff4fd8;--purple:#9870ff;--green:#a2ff8f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 43%,#171b35 0,#0c1020 35%,var(--bg) 75%);color:#eff3ff;font-family:'Space Grotesk',sans-serif;overflow-x:hidden}.ambient{position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 80%)}.shell{position:relative;width:min(100%,388px)}.eyebrow{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 14px;color:#8e9bb7;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}.eyebrow:before,.eyebrow:after{content:'';height:1px;width:26px;background:linear-gradient(90deg,transparent,var(--cyan));opacity:.65}.eyebrow:after{transform:scaleX(-1)}.calculator{padding:20px;border:1px solid #29314c;border-radius:27px;background:linear-gradient(155deg,#171d31ee,#0d1222f5 65%);box-shadow:0 0 0 1px #ffffff06,0 30px 80px #0008,0 0 55px #7b5cff13,inset 0 1px #ffffff0c;backdrop-filter:blur(16px)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:1px 3px 17px}.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.brand-icon{width:27px;height:27px;display:grid;place-items:center;border:1px solid #46ecff75;border-radius:9px;color:var(--cyan);font-size:15px;box-shadow:0 0 15px #4af4ff26}.status{display:flex;align-items:center;gap:7px;color:#75819d;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}.display{height:124px;padding:17px 16px 14px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:9px;border:1px solid #252d45;border-radius:18px;background:linear-gradient(145deg,#0a0e1b,#0b1020);box-shadow:inset 0 4px 20px #0005;margin-bottom:17px;overflow:hidden}.expression{width:100%;min-height:20px;text-align:right;color:#838daa;font:14px 'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result{width:100%;text-align:right;color:#f5f7ff;font:clamp(34px,10vw,48px)/1 'DM Mono',monospace;letter-spacing:-.075em;white-space:nowrap;overflow:hidden;text-overflow:clip;text-shadow:0 0 22px #aabaff22}.result.glow{color:#c4fdff;text-shadow:0 0 16px #4af4ff5c,0 0 38px #4af4ff27}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{height:61px;border:1px solid #273049;border-radius:15px;background:linear-gradient(145deg,#1a2134,#151b2d);color:#e9edfa;font:500 19px 'Space Grotesk',sans-serif;cursor:pointer;transition:transform .13s,border-color .13s,background .13s,box-shadow .13s;user-select:none;-webkit-tap-highlight-color:transparent}.key:hover{transform:translateY(-2px);border-color:#46516f;background:linear-gradient(145deg,#222a40,#1a2135);box-shadow:0 7px 18px #0003}.key:active{transform:translateY(1px) scale(.98)}.key:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.key.utility{color:#aeb8d0;background:linear-gradient(145deg,#20283a,#171e30);font-size:15px;font-weight:600}.key.clear{color:#ff79d9;border-color:#67345f55;background:linear-gradient(145deg,#302039,#20172b)}.key.op{color:var(--cyan);font-size:22px;border-color:#25677355;background:linear-gradient(145deg,#142c39,#152334)}.key.op.active{box-shadow:inset 0 0 0 1px #4af4ff8c,0 0 18px #4af4ff1c;background:#173441}.key.zero{grid-column:span 2}.key.equals{color:#071116;border:1px solid #66f9ff;background:linear-gradient(135deg,#71fbff,#43d8ec);font-size:23px;font-weight:700;box-shadow:0 0 23px #4af4ff37,inset 0 1px #ffffffa8}.key.equals:hover{background:linear-gradient(135deg,#a1ffff,#52e8f5);box-shadow:0 0 32px #4af4ff60}.footer{display:flex;justify-content:space-between;padding:15px 4px 0;color:#616c87;font:10px 'DM Mono',monospace;letter-spacing:.04em}.footer span:last-child{color:#697695}@media(max-width:390px){.calculator{padding:16px;border-radius:23px}.keys{gap:8px}.key{height:57px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body><div class="ambient"></div><main class="shell"><p class="eyebrow">Electric studio</p><section class="calculator" aria-label="Neon calculator"><header class="topbar"><div class="brand"><span class="brand-icon">✳</span> NEON<span style="color:var(--cyan)">/</span>CALC</div><div class="status"><i class="dot"></i> Ready</div></header><div class="display" aria-live="polite" aria-atomic="true"><div class="expression" id="expression">&nbsp;</div><div class="result" id="result">0</div></div><div class="keys" id="keys"><button class="key clear" data-action="clear" aria-label="Clear all">AC</button><button class="key utility" data-action="sign" aria-label="Change sign">+/−</button><button class="key utility" data-action="percent" aria-label="Percent">%</button><button class="key op" data-op="÷" aria-label="Divide">÷</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key op" data-op="×" aria-label="Multiply">×</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key op" data-op="−" aria-label="Subtract">−</button><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key op" data-op="+" aria-label="Add">+</button><button class="key utility" data-action="backspace" aria-label="Delete last digit">⌫</button><button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal" aria-label="Decimal point">.</button><button class="key equals" data-action="equals" aria-label="Equals">=</button></div><footer class="footer"><span>PRECISION, WITH A LITTLE SPARK</span><span>⌨ KEYBOARD READY</span></footer></section></main>
<script>
(()=>{const result=document.querySelector('#result'),expression=document.querySelector('#expression'),keys=document.querySelector('#keys');let current='0',stored=null,operator=null,waiting=false,justDone=false;const fmt=n=>{if(!Number.isFinite(n))return 'Error';if(Math.abs(n)>=1e12||Math.abs(n)>0&&Math.abs(n)<1e-8)return n.toExponential(6).replace(/\.?0+e/,'e');return String(Number(n.toPrecision(11)))};function paint(){result.textContent=current;result.classList.toggle('glow',justDone);expression.textContent=operator&&stored!==null?`${fmt(stored)} ${operator}`:'\u00a0';document.querySelectorAll('.key.op').forEach(b=>b.classList.toggle('active',b.dataset.op===operator&&!waiting))}function digit(d){if(current==='Error'||waiting||justDone){current=d;waiting=false;justDone=false}else if(current.replace('-','').replace('.','').length<14)current=current==='0'?d:current+d;paint()}function choose(op){if(current==='Error')return;const n=Number(current);if(operator&&stored!==null&&!waiting){const next=calc(stored,n,operator);if(!Number.isFinite(next)){current='Error';stored=null;operator=null;waiting=true;paint();return}stored=next;current=fmt(next)}else stored=n;operator=op;waiting=true;justDone=false;paint()}function calc(a,b,op){return op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:b===0?NaN:a/b}function equals(){if(operator===null||stored===null||current==='Error')return;const a=stored,b=Number(current),op=operator;expression.textContent=`${fmt(a)} ${op} ${fmt(b)} =`;const value=calc(a,b,op);current=fmt(value);stored=null;operator=null;waiting=true;justDone=true;paint();expression.textContent=`${fmt(a)} ${op} ${fmt(b)} =`}function clear(){current='0';stored=null;operator=null;waiting=false;justDone=false;paint()}function act(a){if(a==='clear')clear();else if(a==='equals')equals();else if(a==='decimal'){if(current==='Error'||waiting||justDone){current='0.';waiting=false;justDone=false}else if(!current.includes('.'))current+='.';paint()}else if(a==='sign'&&current!=='0'&&current!=='Error'){current=current.startsWith('-')?current.slice(1):'-'+current;paint()}else if(a==='percent'&&current!=='Error'){current=fmt(Number(current)/100);paint()}else if(a==='backspace'){if(current==='Error'||waiting||justDone){current='0';waiting=false;justDone=false}else current=current.length<=1||current.length===2&&current[0]==='-'?'0':current.slice(0,-1);paint()}}keys.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)digit(b.dataset.digit);else if(b.dataset.op)choose(b.dataset.op);else if(b.dataset.action)act(b.dataset.action)});document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[0-9]$/.test(e.key)){digit(e.key);e.preventDefault()}else if(e.key==='.'||e.key===','){act('decimal');e.preventDefault()}else if(e.key==='+'||e.key==='-'){choose(e.key==='-'?'−':'+');e.preventDefault()}else if(e.key==='*'||e.key==='x'||e.key==='X'){choose('×');e.preventDefault()}else if(e.key==='/'){choose('÷');e.preventDefault()}else if(e.key==='Enter'||e.key==='='){equals();e.preventDefault()}else if(e.key==='Backspace'){act('backspace');e.preventDefault()}else if(e.key==='Escape'){clear();e.preventDefault()}else if(e.key==='%'){act('percent');e.preventDefault()}});paint()})();
</script></body></html>
